name: Bug report
description: Report a reproducible Liftwise problem.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping make Liftwise more reliable.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Tap…\n3. See…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Liftwise version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was Liftwise opened?
      options:
        - Installed iPhone PWA
        - Mobile browser
        - Desktop browser
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: iPhone 15, iOS 18.6
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include screenshots if safe. Remove personal workout information first.
